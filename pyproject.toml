[project]
name = "customer-service-agent"
version = "0.1.0"
description = "基于 CrewAI 的多角色银行客服智能体系统"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.86.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-milvus>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "pymilvus[milvus-lite]>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
